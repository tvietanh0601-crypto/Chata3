<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chat Lớp Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- KHUNG CHAT CHÍNH -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl flex flex-col h-[90vh] max-h-[650px]">
        
        <!-- Header Chat -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
            <div>
                <h1 class="text-xs font-bold text-indigo-400">💬 Trò chuyện lớp học</h1>
                <p class="text-[11px] text-slate-400">Xin chào, <span id="current-user-display" class="text-slate-200 font-semibold">...</span></p>
            </div>
            <button id="logout-chat-btn" class="bg-rose-500/10 text-rose-400 text-[11px] px-2.5 py-1.5 rounded-xl font-medium border border-rose-500/20">Về trang chủ</button>
        </div>

        <!-- Danh sách tin nhắn -->
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 pr-1 mb-3 text-xs">
            <p class="text-slate-500 text-center py-6">Đang tải tin nhắn...</p>
        </div>

        <!-- Form gửi tin nhắn (Đã bỏ hoàn toàn ô nhập tên, chỉ còn ô nhập nội dung và nút Gửi đúng như ý cậu) -->
        <form id="chat-form" class="flex gap-2 pt-2 border-t border-slate-800">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500" required>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-medium shadow-md">Gửi</button>
        </form>
    </div>

    <footer class="text-center text-[10px] text-slate-500 mt-3">TranvietanhShop System</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // KIỂM TRA BẢO MẬT: Nếu chưa đăng nhập mà mò vào chat.html bằng link trực tiếp -> Đá cổ về index ngay!
        const currentUser = sessionStorage.getItem('chat_user');
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('current-user-display').innerText = currentUser;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDSUygWMf9mKT_193O5vHJBS-w2LvTQnDE",
            authDomain: "datai4.firebaseapp.com",
            projectId: "datai4",
            storageBucket: "datai4.firebasestorage.app",
            messagingSenderId: "400943989929",
            appId: "1:400943989929:web:a313a16c7166410b0355b8",
            measurementId: "G-XKJMMSQZCD"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        // Nút đăng xuất / về trang chủ
        document.getElementById('logout-chat-btn').addEventListener('click', () => {
            sessionStorage.removeItem('chat_user');
            window.location.href = 'index.html';
        });

        // Lắng nghe tin nhắn realtime
        const messagesContainer = document.getElementById('chat-messages');
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));

        onSnapshot(q, (snapshot) => {
            messagesContainer.innerHTML = snapshot.empty ? '<p class="text-slate-500 text-center py-6">Chưa có tin nhắn nào. Hãy mở lời trước nhé!</p>' : '';
            
            snapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const isMe = msg.sender === currentUser;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                msgDiv.innerHTML = `
                    <span class="text-[10px] text-slate-400 mb-0.5 px-1">${escapeHtml(msg.sender)}</span>
                    <div class="max-w-[80%] px-3 py-2 rounded-2xl text-xs break-words ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 border border-slate-700/60 rounded-bl-none'}">
                        ${escapeHtml(msg.text)}
                    </div>
                `;
                messagesContainer.appendChild(msgDiv);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, (error) => {
            console.error(error);
            messagesContainer.innerHTML = '<p class="text-rose-400 text-center py-6">Lỗi tải tin nhắn chat!</p>';
        });

        // Gửi tin nhắn trực tiếp với tên đã đăng nhập
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();

            if (text && currentUser) {
                try {
                    await addDoc(collection(db, "messages"), {
                        sender: currentUser,
                        text: text,
                        createdAt: serverTimestamp()
                    });
                    inputEl.value = '';
                } catch (err) {
                    alert("Không thể gửi tin nhắn!");
                }
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
