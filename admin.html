<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- MÀN HÌNH KHÓA ADMIN (Mật khẩu "9090") -->
    <div id="auth-screen" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-4">
            <div class="text-3xl mb-1">🔑</div>
            <h2 class="text-lg font-bold text-indigo-400">Đăng Nhập Quản Trị</h2>
            <p class="text-xs text-slate-400">Nhập mật khẩu để vào trang Admin</p>
        </div>
        <form id="login-form" class="space-y-3">
            <input type="password" id="admin-pass" placeholder="Mật khẩu admin" autocomplete="current-password"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 px-3 text-white text-center text-sm focus:outline-none focus:border-indigo-500 tracking-widest" required>
            <div id="admin-error" class="text-rose-400 text-xs text-center hidden font-medium">Sai mật khẩu quản trị!</div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/25">Truy Cập</button>
        </form>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN ADMIN -->
    <div id="admin-dashboard" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl hidden space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-sm font-bold text-indigo-400">⚙️ Quản Lý Học Sinh</h1>
                <p class="text-[11px] text-slate-400">Thêm hoặc đổi mã PIN hệ thống</p>
            </div>
            <button id="logout-btn" class="bg-rose-500/10 text-rose-400 text-xs px-3 py-1.5 rounded-xl font-medium border border-rose-500/20">Đăng xuất</button>
        </div>

        <!-- Form Thêm Học Sinh -->
        <form id="add-student-form" class="flex gap-2">
            <input type="text" id="new-name" placeholder="Họ và tên học sinh..." autocomplete="off"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" required>
            <input type="text" id="new-pin" placeholder="PIN (4 số)" maxlength="4" autocomplete="off"
                class="w-20 bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white text-center focus:outline-none focus:border-indigo-500" required>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-md shadow-indigo-600/20">Thêm</button>
        </form>

        <!-- Danh sách học sinh -->
        <div class="space-y-2">
            <h3 class="text-xs font-semibold text-slate-300">Danh sách hiện tại:</h3>
            <div id="admin-student-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <p class="text-slate-500 text-xs text-center py-4">Đang tải danh sách...</p>
            </div>
        </div>
    </div>

    <!-- Modal Sửa Mã PIN -->
    <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl space-y-3">
            <div>
                <h3 class="text-sm font-semibold text-slate-200">Đổi mật khẩu PIN</h3>
                <p id="edit-student-name" class="text-xs text-indigo-400 mt-0.5"></p>
            </div>
            <form id="edit-pin-form" class="space-y-3">
                <input type="text" id="edit-pin-input" maxlength="4" placeholder="PIN mới (4 số)" autocomplete="off"
                    class="w-full text-center text-base bg-slate-800 border border-slate-700 rounded-xl py-2 px-3 text-white focus:outline-none focus:border-indigo-500" required>
                <div class="flex gap-2">
                    <button type="button" id="cancel-edit-btn" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-xl text-xs font-medium">Hủy</button>
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-medium shadow-md">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center text-[10px] text-slate-500 mt-6">TranvietanhShop System</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSUygWMf9mKT_193O5vHJBS-w2LvTQnDE",
            authDomain: "datai4.firebaseapp.com",
            projectId: "datai4",
            storageBucket: "datai4.firebasestorage.app",
            messagingSenderId: "400943989929",
            appId: "1:400943989929:web:a313a16c7166410b0355b8",
            measurementId: "G-XKJMMSQZCD"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        let editingId = null;

        // Mật khẩu "9090" mã hóa Base64
        const _x0 = "OTA5MA==";
        function getSecretAdminPin() { return atob(_x0); }

        // Xử lý Đăng Nhập
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            const errEl = document.getElementById('admin-error');
            if (pass === getSecretAdminPin()) {
                errEl.classList.add('hidden');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadStudentsAdmin();
            } else {
                errEl.classList.remove('hidden');
            }
        });

        // Xử lý Đăng Xuất
        document.getElementById('logout-btn').addEventListener('click', () => {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        });

        // Tải danh sách học sinh
        async function loadStudentsAdmin() {
            const listEl = document.getElementById('admin-student-list');
            try {
                const snap = await getDocs(collection(db, "students"));
                listEl.innerHTML = snap.empty ? '<p class="text-slate-500 text-xs text-center py-4">Chưa có học sinh nào.</p>' : '';
                
                snap.forEach((docSnap) => {
                    const data = docSnap.data(), id = docSnap.id;
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-2.5 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs";
                    item.innerHTML = `
                        <div>
                            <span class="font-medium text-slate-200">${escapeHtml(data.name)}</span> 
                            <span class="ml-2 font-mono bg-slate-700 px-1.5 py-0.5 rounded text-slate-300">PIN: ${data.pin}</span>
                        </div>
                        <div class="flex gap-1.5">
                            <button data-action="edit" data-id="${id}" data-name="${escapeHtml(data.name)}" class="text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-lg font-medium">Sửa</button>
                            <button data-action="delete" data-id="${id}" class="text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-lg font-medium">Xóa</button>
                        </div>`;
                    listEl.appendChild(item);
                });

                // Gắn sự kiện cho các nút Sửa/Xóa mới sinh ra
                listEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const action = e.target.getAttribute('data-action');
                        const id = e.target.getAttribute('data-id');
                        if (action === 'edit') {
                            const name = e.target.getAttribute('data-name');
                            openEditModal(id, name);
                        } else if (action === 'delete') {
                            if (confirm("Cậu có chắc muốn xóa học sinh này không?")) {
                                await deleteDoc(doc(db, "students", id));
                                loadStudentsAdmin();
                            }
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                listEl.innerHTML = '<p class="text-rose-400 text-xs text-center py-4">Lỗi tải dữ liệu từ Firestore!</p>';
            }
        }

        // Xử lý Thêm Học Sinh
        document.getElementById('add-student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('new-name');
            const pinInput = document.getElementById('new-pin');
            const name = nameInput.value.trim();
            const pin = pinInput.value.trim();

            if (name && pin.length === 4) {
                try {
                    await addDoc(collection(db, "students"), { name, pin });
                    nameInput.value = '';
                    pinInput.value = '';
                    loadStudentsAdmin();
                } catch (err) {
                    alert("Không thể thêm! Hãy kiểm tra lại kết nối mạng.");
                }
            } else {
                alert("Vui lòng điền tên và mã PIN gồm đúng 4 chữ số!");
            }
        });

        // Modal Sửa PIN
        function openEditModal(id, name) {
            editingId = id;
            document.getElementById('edit-student-name').innerText = `Học sinh: ${name}`;
            document.getElementById('edit-pin-input').value = '';
            document.getElementById('edit-modal').classList.replace('hidden', 'flex');
        }

        document.getElementById('cancel-edit-btn').addEventListener('click', () => {
            document.getElementById('edit-modal').classList.replace('flex', 'hidden');
            editingId = null;
        });

        document.getElementById('edit-pin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPin = document.getElementById('edit-pin-input').value.trim();
            if (editingId && newPin.length === 4) {
                try {
                    await updateDoc(doc(db, "students", editingId), { pin: newPin });
                    document.getElementById('edit-modal').classList.replace('flex', 'hidden');
                    editingId = null;
                    loadStudentsAdmin();
                } catch (err) {
                    alert("Không thể cập nhật PIN!");
                }
            } else {
                alert("Mã PIN mới phải đủ 4 chữ số!");
            }
        });

        // Hàm phụ trợ chống lỗi ký tự HTML
        function escaparHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
