<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Học Sinh - Không sợ đơ nút</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #218838; }
        .error-msg {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }
        ul { padding-left: 20px; margin-top: 20px; }
        li { margin-bottom: 8px; font-size: 15px; }
        .btn-xoa {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Thêm Học Sinh</h2>
    
    <!-- Dùng form nhưng được bảo vệ bằng e.preventDefault() -->
    <form id="studentForm">
        <div class="form-group">
            <label for="txtName">Họ và tên:</label>
            <input type="text" id="txtName" placeholder="Nhập tên học sinh..." autocomplete="off">
            <span id="nameError" class="error-msg"></span>
        </div>

        <div class="form-group">
            <label for="txtPin">Mã PIN (4 chữ số):</label>
            <input type="number" id="txtPin" placeholder="Ví dụ: 1234" maxlength="4">
            <span id="pinError" class="error-msg"></span>
        </div>

        <button type="submit" id="btnAdd">Thêm ngay</button>
    </form>

    <h3>Danh sách đã thêm:</h3>
    <ul id="displayList"></ul>
</div>

<script>
    // 1. Khai báo các phần tử an toàn (Kiểm tra null để tránh crash code)
    const form = document.getElementById('studentForm');
    const nameInput = document.getElementById('txtName');
    const pinInput = document.getElementById('txtPin');
    const displayList = document.getElementById('displayList');
    const nameError = document.getElementById('nameError');
    const pinError = document.getElementById('pinError');

    // 2. Tải dữ liệu từ LocalStorage (Dùng try-catch phòng trường hợp bộ nhớ trình duyệt bị lỗi)
    let studentList = [];
    try {
        const savedData = localStorage.getItem('safe_student_list');
        if (savedData) {
            studentList = JSON.parse(savedData);
        }
    } catch (err) {
        console.error("Lỗi đọc LocalStorage:", err);
        studentList = [];
    }

    // 3. Hàm render danh sách ra màn hình
    function renderList() {
        displayList.innerHTML = '';
        
        if (studentList.length === 0) {
            displayList.innerHTML = '<li style="color: #888; list-style: none;">Chưa có học sinh nào.</li>';
            return;
        }

        studentList.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<b>${item.name}</b> (PIN: ${item.pin}) 
                            <button class="btn-xoa" onclick="deleteStudent(${index})">Xóa</button>`;
            displayList.appendChild(li);
        });
    }

    // Chạy hiển thị lần đầu
    renderList();

    // 4. Bắt sự kiện SUBMIT với lớp phòng thủ cực mạnh
    form.addEventListener('submit', function(e) {
        // [CHẶN 1] Bắt buộc chặn reload trang làm đơ và mất dữ liệu form
        e.preventDefault(); 

        // Xóa sạch thông báo lỗi cũ
        nameError.textContent = '';
        pinError.textContent = '';

        // Lấy giá trị và loại bỏ khoảng trắng thừa
        const nameVal = nameInput.value.trim();
        const pinVal = pinInput.value.trim();

        let hasError = false;

        // [CHẶN 2] Kiểm tra tên trống
        if (!nameVal) {
            nameError.textContent = 'Vui lòng không để trống tên học sinh!';
            hasError = true;
        }

        // [CHẶN 3] Kiểm tra mã PIN (Bắt buộc đủ 4 số, không âm, không để trống)
        if (!pinVal || pinVal.length !== 4 || isNaN(pinVal)) {
            pinError.textContent = 'Mã PIN phải là dãy số gồm đúng 4 chữ số!';
            hasError = true;
        }

        // Nếu có lỗi -> Dừng lại ngay lập tức, không cho chạy tiếp tránh kẹt code
        if (hasError) {
            return;
        }

        // [CHẶN 4] Thêm dữ liệu vào mảng an toàn
        try {
            studentList.push({
                name: nameVal,
                pin: pinVal,
                time: new Date().getTime()
            });

            // Lưu vào LocalStorage
            localStorage.setItem('safe_student_list', JSON.stringify(studentList));

            // Cập nhật lại giao diện
            renderList();

            // Reset form sạch sẽ để nhập tiếp
            nameInput.value = '';
            pinInput.value = '';
            nameInput.focus(); // Đưa con trỏ chuột về ô nhập tên cho mượt

            console.log("Thêm thành công học sinh mới!");

        } catch (storageErr) {
            alert("Lỗi lưu trữ dữ liệu trên thiết bị: " + storageErr.message);
        }
    });

    // 5. Hàm xóa phụ trợ (để quản lý danh sách dễ hơn)
    window.deleteStudent = function(index) {
        studentList.splice(index, 1);
        localStorage.setItem('safe_student_list', JSON.stringify(studentList));
        renderList();
    };
</script>

</body>
</html>
